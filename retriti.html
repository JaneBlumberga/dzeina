<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spindzeles</title>
<style>

:root{
  --peach: #fdf0e2;
  --card: #fff7ec;
  --clay: #e2934f;
  --clay-deep: #b86a2e;
  --brown: #5b4332;
  --brown-soft: #7a6753;
  --mist: #f3d9b8;
  --font-display: 'Georgia', 'Iowan Old Style', serif;
  --font-body: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--peach);
  color:var(--brown-soft);
  font-family:var(--font-body);
}

/* Header */
header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:24px 40px;
  background:transparent;
}

.logo{
  font-family:var(--font-display);
  font-weight:700;
  font-size:21px;
  letter-spacing:.02em;
  color:#fff;
  background:var(--clay);
  padding:14px 26px;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

nav{
  display:flex;
  gap:8px;
  background:rgba(255,255,255,0.4);
  border:1px solid rgba(255,255,255,0.6);
  backdrop-filter:blur(6px);
  padding:8px;
  border-radius:14px;
  box-shadow:0 6px 18px rgba(0,0,0,0.08);
}

nav a{
  color:var(--brown);
  text-decoration:none;
  font-size:14px;
  font-weight:600;
  letter-spacing:.01em;
  padding:10px 18px;
  border-radius:9px;
  transition:background .18s ease;
}

nav a:hover{
  background:rgba(255,255,255,0.6);
}

@media (max-width:680px){
  header{padding:16px 18px;flex-wrap:wrap;gap:12px;}
  .logo{font-size:17px;padding:11px 18px;}
  nav{gap:2px;padding:6px;}
  nav a{font-size:12px;padding:8px 11px;}
}

/* Simple hero placeholder behind the bubble */
.hero{
  position:relative;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(160deg, var(--mist) 0%, var(--peach) 60%);
}

.hero-eyebrow{
  font-size:13px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--clay-deep);
  font-weight:700;
  margin:0 0 18px;
}

.hero h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(34px,5.5vw,52px);
  line-height:1.1;
  color:var(--brown);
  margin:0 0 16px;
  text-align:center;
}

.hero p{
  font-size:16px;
  line-height:1.6;
  color:var(--brown-soft);
  max-width:420px;
  margin:0 auto;
  text-align:center;
}

/* Bubble / popup */
.bubble-overlay{
  position:fixed;
  inset:0;
  background:rgba(91,67,50,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:200;
  opacity:0;
  visibility:hidden;
  transition:opacity .3s ease, visibility .3s ease;
}

.bubble-overlay.show{
  opacity:1;
  visibility:visible;
}

.bubble{
  background:var(--card);
  border:1px solid var(--mist);
  border-radius:24px;
  max-width:380px;
  width:100%;
  padding:40px 32px;
  text-align:center;
  position:relative;
  box-shadow:0 24px 60px rgba(91,67,50,0.3);
  transform:translateY(16px) scale(.96);
  transition:transform .3s ease;
}

.bubble-overlay.show .bubble{
  transform:translateY(0) scale(1);
}

.bubble-icon{
  font-size:40px;
  margin-bottom:14px;
}

.bubble h2{
  font-family:var(--font-display);
  font-size:24px;
  color:var(--brown);
  margin:0 0 12px;
}

.bubble p{
  font-size:14.5px;
  line-height:1.6;
  color:var(--brown-soft);
  margin:0 0 24px;
}

.bubble .btn{
  display:inline-block;
  background:var(--clay);
  color:#fff;
  text-decoration:none;
  font-size:14.5px;
  font-weight:600;
  padding:13px 28px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition:background .18s ease, transform .18s ease;
}

.bubble .btn:hover{
  background:var(--clay-deep);
  transform:translateY(-2px);
}

.bubble-close{
  position:absolute;
  top:14px;
  right:16px;
  background:none;
  border:none;
  font-size:18px;
  color:var(--brown-soft);
  cursor:pointer;
  line-height:1;
}

</style>
</head>
<body>

<header id="siteHeader">
  <div class="logo">Spindzeles</div>
  <nav>
    <a href="index.html">Sākums</a>
    <a href="darbicas.html">Darbnīcas</a>
    <a href="rokdarbi.html">Radošas nodarbības</a>
    <a href="retriti.html">Retrīti</a>
  </nav>
</header>

<section class="hero">
  <div>
    <p class="hero-eyebrow">Drīzumā</p>
    <h1>Šī sadaļa tiek gatavota</h1>
    <p>Mēs strādājam, lai šī lapa kļūtu tikpat skaista kā pārējās. Atgriezies drīz!</p>
  </div>
</section>

<!-- "Under construction" bubble -->
<div class="bubble-overlay show" id="bubbleOverlay">
  <div class="bubble">
    <button type="button" class="bubble-close" onclick="closeBubble()" aria-label="Aizvērt">✕</button>
    <div class="bubble-icon">🐝</div>
    <h2>Izstrādes procesā</h2>
    <p>Šī lapa vēl top — drīzumā šeit būs pieejama pilna informācija. Paldies par sapratni!</p>
    <button type="button" class="btn" onclick="closeBubble()">Sapratu</button>
  </div>
</div>

<script>
  function closeBubble(){
    document.getElementById('bubbleOverlay').classList.remove('show');
  }

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeBubble();
  });
</script>

</body>
</html>
